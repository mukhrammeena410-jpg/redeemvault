<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RedeemVault Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:#050505;
color:white;
padding:20px;
}

.logo{
font-size:55px;
font-weight:bold;
color:#00ff88;
text-shadow:0 0 20px #00ff88;
margin-bottom:25px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#111;
border:1px solid #00ff88;
padding:20px;
border-radius:18px;
}

.card h2{
color:#00ff88;
margin-bottom:10px;
}

.card p{
font-size:22px;
font-weight:bold;
}

.search{
width:100%;
padding:15px;
background:#111;
border:1px solid #00ff88;
border-radius:10px;
color:white;
margin-bottom:20px;
}

.table{
background:#111;
border:1px solid #00ff88;
border-radius:18px;
overflow:hidden;
}

.row{
display:grid;
grid-template-columns:1fr 2fr 1fr 1fr 1fr;
padding:15px;
border-bottom:1px solid #222;
align-items:center;
}

.head{
background:#00ff88;
color:black;
font-weight:bold;
}

.status{
font-weight:bold;
color:#00ff88;
}

.btn{
padding:6px 10px;
border:none;
border-radius:8px;
cursor:pointer;
margin-right:5px;
}

.approve{
background:#00ff88;
color:black;
}

.delete{
background:red;
color:white;
}

.logout{
background:red;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}

.footer{
margin-top:25px;
text-align:center;
color:#00ff88;
}

@media(max-width:700px){

.row{
grid-template-columns:1fr;
gap:8px;
}

.stats{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<script>

<script>

if(sessionStorage.getItem("adminLogin")!="yes"){

let password = prompt("Enter Admin Password");

if(password=="SHAI1234LESH5678"){

sessionStorage.setItem("adminLogin","yes");

}else{

alert("Wrong Password");

window.location.href="https://google.com";

}

}

</script>

</script>

<div class="logo">
RedeemVault Admin
</div>

<div class="stats">

<div class="card">
<h2>Orders</h2>
<p id="totalOrders">0</p>
</div>

<div class="card">
<h2>Revenue</h2>
<p id="revenue">₹0</p>
</div>

<div class="card">
<h2>Pending</h2>
<p id="pending">0</p>
</div>

<div class="card">
<h2>Completed</h2>
<p id="completed">0</p>
</div>

</div>
<input
type="text"
id="searchBox"
class="search"
placeholder="Search Orders..."
>

<div class="table">

<div class="row head">

<div>Order ID</div>

<div>Email</div>

<div>Amount</div>

<div>Status</div>

<div>Action</div>

</div>

<div id="ordersContainer"></div>

</div>

<button
class="logout"
onclick="logout()"
>
Logout
</button>

<div class="footer">

© RedeemVault Secure Admin Panel

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxPkBV9beaj9Y5a_QqUM5tdL_ppnIm7wucqQ6OIaVUbEVKvOGTx3vGt_yi2ODMIHKVu/exec";

function logout(){

sessionStorage.removeItem("adminLogin");

location.reload();

}

function approveOrder(orderId){

fetch(
API_URL +
"?action=approve&orderId=" +
orderId
)

.then(() => {

alert("Order Approved");

loadOrders();

});

}

function deleteOrder(orderId){

if(!confirm("Delete Order ?")) return;

fetch(
API_URL +
"?action=delete&orderId=" +
orderId
)

.then(() => {

alert("Order Deleted");

loadOrders();

});

}
function loadOrders(){

fetch(API_URL)

.then(res => res.json())

.then(data => {

let orders = data.slice(2);

let html = "";

let revenue = 0;

let pending = 0;

let completed = 0;

orders.forEach(order => {

revenue += Number(order[3]) || 0;

if(String(order[4]).trim() === "Pending"){

pending++;

}else{

completed++;

}

html += `

<div class="row">

<div>${order[0]}</div>

<div>${order[1]}</div>

<div>₹${order[3]}</div>

<div class="status">

${order[4]}

</div>

<div>

${String(order[4]).trim() === "Pending"

?

`<button
class="btn approve"
onclick="approveOrder('${order[0]}')">
Approve
</button>`

:

""

}

<button
class="btn delete"
onclick="deleteOrder('${order[0]}')">
Delete
</button>

</div>

</div>

`;

});

document.getElementById("ordersContainer").innerHTML = html;

document.getElementById("totalOrders").innerText =
orders.length;

document.getElementById("revenue").innerText =
"₹" + revenue;

document.getElementById("pending").innerText =
pending;

document.getElementById("completed").innerText =
completed;

});

}

loadOrders();

setInterval(loadOrders,10000);
document
.getElementById("searchBox")
.addEventListener("keyup",function(){

let value =
this.value.toLowerCase();

document
.querySelectorAll("#ordersContainer .row")
.forEach(row => {

row.style.display =

row.innerText
.toLowerCase()
.includes(value)

?

"grid"

:

"none";

});

});

</script>

</body>

</html>
