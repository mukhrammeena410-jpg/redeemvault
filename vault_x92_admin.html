<!DOCTYPE html>
<html>
<head>
<title>RedeemVault Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:#050505;
color:white;
padding:25px;
}

.logo{
font-size:35px;
font-weight:bold;
color:#00ff88;
margin-bottom:25px;
text-shadow:0 0 15px #00ff88;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#111;
border:1px solid #00ff88;
padding:20px;
border-radius:15px;
}

.card h2{
color:#00ff88;
margin-bottom:10px;
}

.search{
width:100%;
padding:15px;
margin-top:25px;
margin-bottom:25px;
background:#111;
border:1px solid #00ff88;
border-radius:10px;
color:white;
}

.table{
background:#111;
border:1px solid #00ff88;
border-radius:15px;
overflow:hidden;
}

.row{
display:grid;
grid-template-columns:1fr 2fr 1fr 1fr;
padding:15px;
border-bottom:1px solid #222;
}

.head{
background:#00ff88;
color:black;
font-weight:bold;
}

.status{
color:#00ff88;
font-weight:bold;
}

.footer{
margin-top:30px;
text-align:center;
color:#00ff88;
}

</style>

</head>

<body>

<div class="logo">
RedeemVault Admin
</div>

<div class="stats">

<div class="card">
<h2>Orders</h2>
<p id="totalOrders">0</p>
</div>

<div class="card">
<h2>Revenue</h2>
<p id="revenue">₹0</p>
</div>

<div class="card">
<h2>Pending</h2>
<p id="pending">0</p>
</div>

<div class="card">
<h2>Completed</h2>
<p id="completed">0</p>
</div>

</div>

<input
class="search"
id="searchBox"
placeholder="Search Orders..."
>

<div class="table">

<div class="row head">
<div>Order ID</div>
<div>Email</div>
<div>Amount</div>
<div>Status</div>
</div>
<div id="ordersContainer"></div>
</div>

<div class="footer">
© RedeemVault Secure Admin Panel
</div>
<script>

fetch("https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnSCpyZRos4YAqtanmiGAdpZipRf5__wItKuAH7RycrnYKft1gSA1gRSbwUKf_3qfpBLZwNzyDf65ATBcA89dzOQzmVaoxiI51bQbWHNrK9mgYfZCQbPUptMw6ql78V1bwIVhPpF37EFfNqls7D6z50lQDMMdBJ9SQmEB5LfxBUpUe7j148gL71zmiRyfkwh16U3vYhlw0TMp_DcGa8EZYSbZAFLk3DSm_blWFGmM3hIl1MibXb2Wcsbjfd34sSt2Q2NKVgowqgiwjn6qTvq9BDWbW9X2w&lib=Mwh_LN3rahIQDOkb_Ozr5E8AfhRiM0kpR")
.then(res => res.json())
.then(data => {

let orders = data.slice(2);

let html = "";
let revenue = 0;
let pending = 0;
let completed = 0;
orders.forEach(order => {
console.log(order);
revenue += Number(order[3] || 0);

if(String(order[4]).trim() == "Pending")
pending++;
else
completed++;
html += `
<div class="row">
<div>${order[0]}</div>
<div>${order[1]}</div>
<div>₹${order[3]}</div>
<div class="status">${order[4]}</div>
</div>
`;

});

document.getElementById("ordersContainer").innerHTML = html;
document.getElementById("totalOrders").innerText = orders.length;
document.getElementById("revenue").innerText = "₹" + revenue;
document.getElementById("pending").innerText = pending;
document.getElementById("completed").innerText = completed;
});

</script>
</body>
</html>
