<!DOCTYPE html>
<html>
<head>
<title>RedeemVault Admin</title>

<style>

body{
background:#050505;
color:white;
font-family:Segoe UI;
padding:20px;
}

.logo{
font-size:50px;
font-weight:bold;
color:#00ff88;
margin-bottom:20px;
text-shadow:0 0 20px #00ff88;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:20px;
}

.card{
background:#111;
border:1px solid #00ff88;
padding:20px;
border-radius:20px;
}

.card h2{
color:#00ff88;
}

.search{
width:100%;
padding:15px;
background:#111;
border:1px solid #00ff88;
border-radius:10px;
color:white;
margin-bottom:20px;
}

.table{
border:1px solid #00ff88;
border-radius:20px;
overflow:hidden;
}

.row{
display:grid;
grid-template-columns:1fr 2fr 1fr 1fr;
padding:15px;
border-bottom:1px solid #222;
}

.head{
background:#00ff88;
color:black;
font-weight:bold;
}

.status{
color:#00ff88;
font-weight:bold;
}

.footer{
text-align:center;
margin-top:20px;
color:#00ff88;
}

</style>

</head>

<body>

<div class="logo">
RedeemVault Admin
</div>

<div class="stats">

<div class="card">
<h2>Orders</h2>
<p id="totalOrders">0</p>
</div>

<div class="card">
<h2>Revenue</h2>
<p id="revenue">₹0</p>
</div>

<div class="card">
<h2>Pending</h2>
<p id="pending">0</p>
</div>

<div class="card">
<h2>Completed</h2>
<p id="completed">0</p>
</div>

</div>

<input
class="search"
id="searchBox"
placeholder="Search Orders..."
>

<div class="table">

<div class="row head">
<div>Order ID</div>
<div>Email</div>
<div>Amount</div>
<div>Status</div>
</div>

<div id="ordersContainer"></div>

</div>

<div class="footer">
© RedeemVault Secure Admin Panel
</div>

<script>

fetch("https://script.google.com/macros/s/AKfycbxPkBV9beaj9Y5a_QqUM5tdL_ppnIm7wucqQ6OIaVUbEVKvOGTx3vGt_yi2ODMIHKVu/exec")

.then(res => res.json())

.then(data => {

let orders = data.slice(2);

let html = "";

let revenue = 0;
let pending = 0;
let completed = 0;

orders.forEach(order => {

revenue += Number(order[3]) || 0;

if(String(order[4]).trim() == "Pending")
pending++;
else
completed++;

html += `
<div class="row">
<div>${order[0]}</div>
<div>${order[1]}</div>
<div>₹${order[3]}</div>
<div class="status">${order[4]}</div>
</div>
`;

});

document.getElementById("ordersContainer").innerHTML = html;

document.getElementById("totalOrders").innerText = orders.length;

document.getElementById("revenue").innerText = "₹" + revenue;

document.getElementById("pending").innerText = pending;

document.getElementById("completed").innerText = completed;

});

</script>

</body>
</html>
