<!DOCTYPE html>
<html>
<head>
<title>RedeemVault Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:#050505;
color:white;
padding:25px;
}

.logo{
font-size:35px;
font-weight:bold;
color:#00ff88;
margin-bottom:25px;
text-shadow:0 0 15px #00ff88;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#111;
border:1px solid #00ff88;
padding:20px;
border-radius:15px;
}

.card h2{
color:#00ff88;
margin-bottom:10px;
}

.search{
width:100%;
padding:15px;
margin-top:25px;
margin-bottom:25px;
background:#111;
border:1px solid #00ff88;
border-radius:10px;
color:white;
}

.table{
background:#111;
border:1px solid #00ff88;
border-radius:15px;
overflow:hidden;
}

.row{
display:grid;
grid-template-columns:1fr 2fr 1fr 1fr;
padding:15px;
border-bottom:1px solid #222;
}

.head{
background:#00ff88;
color:black;
font-weight:bold;
}

.status{
color:#00ff88;
font-weight:bold;
}

.footer{
margin-top:30px;
text-align:center;
color:#00ff88;
}

</style>

</head>

<body>

<div class="logo">
RedeemVault Admin
</div>

<div class="stats">

<div class="card">
<h2>Orders</h2>
<p>128</p>
</div>

<div class="card">
<h2>Revenue</h2>
<p>₹12,500</p>
</div>

<div class="card">
<h2>Pending</h2>
<p>12</p>
</div>

<div class="card">
<h2>Completed</h2>
<p>116</p>
</div>

</div>

<input
class="search"
placeholder="Search Orders..."
>

<div class="table">

<div class="row head">
<div>Order ID</div>
<div>Email</div>
<div>Amount</div>
<div>Status</div>
</div>

<div class="row">
<div>RV-5832</div>
<div>user@gmail.com</div>
<div>₹50</div>
<div class="status">Paid</div>
</div>

<div class="row">
<div>RV-9281</div>
<div>demo@gmail.com</div>
<div>₹120</div>
<div class="status">Pending</div>
</div>

<div class="row">
<div>RV-4471</div>
<div>test@gmail.com</div>
<div>₹250</div>
<div class="status">Paid</div>
</div>

</div>

<div class="footer">
© RedeemVault Secure Admin Panel
</div>

</body>
</html>
