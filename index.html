<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedeemVault</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020617,#081028,#000);
color:white;
overflow:hidden;
}

.hero{
text-align:center;
}

.badge{
display:inline-block;
padding:10px 20px;
border:1px solid #00ff88;
border-radius:30px;
color:#00ff88;
margin-bottom:20px;
box-shadow:0 0 20px #00ff8840;
}

h1{
font-size:80px;
background:linear-gradient(90deg,#fff,#00ff88);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
font-size:20px;
color:#b8b8b8;
margin-top:10px;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 35px;
border-radius:12px;
background:#00ff88;
color:black;
font-weight:bold;
text-decoration:none;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 25px #00ff88;
}
</style>
</head>

<body>

<div class="hero">

<div class="badge">
🟢 LIVE COLLECTION
</div>

<h1>RedeemVault</h1>

<p>Premium Google Play Redeem Codes</p>

<a href="#" class="btn">Browse Codes</a>

</div>

</body>
</html>
